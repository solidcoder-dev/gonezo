name: JVM quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew test spotlessCheck checkLayerBoundaries
      - run: ./gradlew buildHealth
        continue-on-error: true
