name: Native quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clang-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android/app/src/main/cpp/speech-transcription
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null
      - run: sdkmanager "platforms;android-36" "ndk;28.0.13004108" "cmake;3.22.1"
      - run: clang-format --dry-run --Werror whisper_jni.cpp
      - run: >
          cmake -S .
          -B /tmp/gonezo-whisper-jni
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DGONEZO_ENABLE_CLANG_TIDY=ON
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DANDROID_NDK=$ANDROID_SDK_ROOT/ndk/28.0.13004108
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/28.0.13004108/build/cmake/android.toolchain.cmake
      - run: cmake --build /tmp/gonezo-whisper-jni --target gonezo_whisper_jni
